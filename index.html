<!DOCTYPE html><html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eid Frame Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Hind Siliguri',sans-serif;
  background:linear-gradient(135deg,#f5e6c8,#f1d9a6);
  color:#5a2a00;
}body.dark{ background:linear-gradient(135deg,#0f0f0f,#1f1f1f); color:#fff; }

.container{ max-width:420px; margin:auto; padding:12px; }

h3{ text-align:center; margin:10px 0; }

.glass{ background:rgba(255,255,255,0.25); backdrop-filter:blur(12px); border-radius:18px; padding:14px; margin:10px 0; }

body.dark .glass{ background:rgba(0,0,0,0.35); }

.upload-box{ border:2px dashed rgba(0,0,0,0.2); padding:20px; border-radius:16px; cursor:pointer; }

.upload-box:hover{ transform:scale(1.02); }

.upload-box input{ display:none; }

canvas{ width:100%; border-radius:14px; box-shadow:0 8px 25px rgba(0,0,0,0.2); }

.controls{ display:flex; justify-content:space-between; gap:8px; }

.btn{ flex:1; padding:12px; border:none; border-radius:12px; font-weight:600; cursor:pointer; background:linear-gradient(45deg,#ff3c00,#ff7a00); color:#fff; transition:.2s; }

.btn:active{ transform:scale(.95); }

.toggle{ position:fixed; top:10px; right:10px; border:none; padding:8px 10px; border-radius:10px; } </style>

</head>
<body><button class="toggle" onclick="toggleDark()">🌙</button>

<div class="container"><h3>✨ ঈদ ফ্রেম এডিটর</h3><div class="glass">
  <label class="upload-box">
    📷 ছবি আপলোড করুন
    <input type="file" id="upload" accept="image/*">
  </label>
</div><div class="glass">
  <canvas id="canvas"></canvas>
</div><div class="glass controls">
  <button class="btn" onclick="zoomIn()">🔍 জুম</button>
  <button class="btn" onclick="zoomOut()">➖ ছোট</button>
  <button class="btn" onclick="downloadImage()">⬇️ সেভ</button>
</div></div><script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let userImg=new Image();
let frameImg=new Image();
let scale=1,posX=0,posY=0,drag=false,lastX=0,lastY=0;

frameImg.src='frame.png';
frameImg.onload=()=>{
  canvas.width=frameImg.width;
  canvas.height=frameImg.height;
  draw();
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(userImg.src){
    ctx.drawImage(userImg,posX,posY,userImg.width*scale,userImg.height*scale);
  }
  ctx.drawImage(frameImg,0,0,canvas.width,canvas.height);
}

upload.onchange=e=>{
  const file=e.target.files[0];
  const r=new FileReader();
  r.onload=ev=>{
    userImg.src=ev.target.result;
    userImg.onload=()=>{
      scale=canvas.width/userImg.width;
      posX=0;posY=0;
      draw();
    }
  }
  r.readAsDataURL(file);
}

canvas.onpointerdown=e=>{drag=true;lastX=e.clientX;lastY=e.clientY}
canvas.onpointermove=e=>{
  if(!drag)return;
  posX+=e.clientX-lastX;
  posY+=e.clientY-lastY;
  lastX=e.clientX;lastY=e.clientY;
  requestAnimationFrame(draw);
}
canvas.onpointerup=()=>drag=false;
canvas.onpointerleave=()=>drag=false;

function zoomIn(){scale+=0.1;requestAnimationFrame(draw)}
function zoomOut(){scale=Math.max(0.1,scale-0.1);requestAnimationFrame(draw)}

function downloadImage(){
  const a=document.createElement('a');
  a.download='eid.jpg';
  a.href=canvas.toDataURL('image/jpeg',0.95);
  a.click();
}

function toggleDark(){document.body.classList.toggle('dark')}
</script></body>
  </html>
